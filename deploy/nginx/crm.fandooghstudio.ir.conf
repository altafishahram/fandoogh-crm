# ملک بان — production HTTPS virtual host
# دامنه: crm.fandooghstudio.ir

server {
    listen 80;
    listen [::]:80;
    server_name crm.fandooghstudio.ir;
    server_tokens off;

    # مسیر موردنیاز Let’s Encrypt برای اعتبارسنجی HTTP-01
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fandoogh/current/backend/public;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.fandooghstudio.ir;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/crm.fandooghstudio.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.fandooghstudio.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/fandoogh/current/backend/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fandoogh/current/backend/public;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/fandoogh-access.log;
    error_log /var/log/nginx/fandoogh-error.log warn;
}
