name: fandoogh_crm
description: Android-first mobile client for MelkBan real-estate CRM.
publish_to: 'none'
version: 0.2.0+4

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  uuid: ^4.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: YekanBakh
      fonts:
        - asset: assets/fonts/YekanBakhFaNum-VF.ttf
          weight: 100
        - asset: assets/fonts/YekanBakhFaNum-VF.ttf
          weight: 400
        - asset: assets/fonts/YekanBakhFaNum-VF.ttf
          weight: 700
        - asset: assets/fonts/YekanBakhFaNum-VF.ttf
          weight: 900
